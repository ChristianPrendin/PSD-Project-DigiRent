openapi: 3.0.3
info:
  title: DigiRent API
  version: 1.0.0
  description: |
    REST interfaces for all interactions between DigiRent and its black-box
    participants (Customer, Owner, Commercial Partner) as modelled in the
    BPMN collaboration diagram.

    **Point of view:** DigiRent as orchestrator.

    - Endpoints tagged **DigiRent** are exposed by DigiRent and called by participants.
    - Endpoints tagged **Customer** are exposed by the Customer service and called by DigiRent.
    - Endpoints tagged **Owner** are exposed by the Owner service and called by DigiRent.
    - Endpoints tagged **CommercialPartner** are exposed by the Commercial Partner service
      and called by DigiRent.

    **Correlation key:** `rentalId` — generated by DigiRent on `POST /rentals` and carried
    in every subsequent interaction to route messages to the correct process instance.

tags:
  - name: DigiRent
    description: Endpoints exposed by DigiRent (participants call DigiRent)
  - name: Customer
    description: Endpoints exposed by the Customer service (DigiRent calls Customer)
  - name: Owner
    description: Endpoints exposed by the Owner service (DigiRent calls Owner)
  - name: CommercialPartner
    description: Endpoints exposed by the Commercial Partner service (DigiRent calls Partner)

paths:

  # =========================================================
  # DIGIRENT ENDPOINTS — called by participants
  # =========================================================

  /rentals:
    post:
      tags: [DigiRent]
      summary: Submit a rental request
      operationId: submitRentalRequest
      description: |
        Customer submits a new rental request. DigiRent creates a new process
        instance and returns the rentalId used as correlation key for all
        subsequent interactions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalRequest'
      responses:
        '201':
          description: Rental request created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalCreated'
        '400':
          description: Invalid request body.

  /rentals/{rentalId}/proposals:
    get:
      tags: [DigiRent]
      summary: Retrieve apartment shortlist
      operationId: getApartmentShortlist
      description: |
        Customer retrieves the list of apartments proposed by DigiRent
        for the given rental request. Available after DigiRent completes
        its internal search.
      parameters:
        - $ref: '#/components/parameters/rentalId'
      responses:
        '200':
          description: Apartment shortlist available.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Apartment'
        '404':
          description: Rental request not found or proposals not yet ready.

  /rentals/{rentalId}/selection:
    post:
      tags: [DigiRent]
      summary: Submit customer selection
      operationId: submitCustomerSelection
      description: |
        Customer submits their decision after reviewing the apartment shortlist:
        interested in one or more apartments, not interested, or withdrawn.
      parameters:
        - $ref: '#/components/parameters/rentalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSelection'
      responses:
        '200':
          description: Selection recorded.
        '404':
          description: Rental request not found.

  /rentals/{rentalId}/visit-schedule:
    get:
      tags: [DigiRent]
      summary: Retrieve proposed visit schedule
      operationId: getVisitSchedule
      description: |
        Customer retrieves the visit schedule proposed by DigiRent after
        collecting availability from the relevant owners.
        Returns 404 if the schedule is not yet available (e.g. owners have
        not responded yet).
      parameters:
        - $ref: '#/components/parameters/rentalId'
      responses:
        '200':
          description: Proposed visit schedule.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewingSlot'
        '404':
          description: Rental not found or schedule not yet available.

  /rentals/{rentalId}/visit-confirmation:
    post:
      tags: [DigiRent]
      summary: Confirm or decline visit schedule
      operationId: confirmVisitSchedule
      description: |
        Customer confirms or declines the proposed visit schedule.
        If no slot is confirmed, the propose-and-negotiate phase continues
        without visits.
      parameters:
        - $ref: '#/components/parameters/rentalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleConfirmation'
      responses:
        '200':
          description: Visit confirmation recorded.
        '404':
          description: Rental request not found.

  /rentals/{rentalId}/terms:
    get:
      tags: [DigiRent]
      summary: Retrieve final rental terms
      operationId: getFinalTerms
      description: |
        Customer retrieves the final rental terms proposed by DigiRent at the
        end of the propose-and-negotiate phase (internal or partner).
      parameters:
        - $ref: '#/components/parameters/rentalId'
      responses:
        '200':
          description: Final terms available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalTerms'
        '404':
          description: Rental not found or terms not yet available.

  /rentals/{rentalId}/outcome:
    post:
      tags: [DigiRent]
      summary: Submit negotiation outcome
      operationId: submitNegotiationOutcome
      description: |
        Customer communicates the result of the negotiation: accepted, rejected,
        or withdrawn. Accepted moves the process to the closing chain; rejected
        triggers the partner loop; withdrawn terminates the process.
      parameters:
        - $ref: '#/components/parameters/rentalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NegotiationOutcome'
      responses:
        '200':
          description: Negotiation outcome recorded.
        '404':
          description: Rental request not found.

  /rentals/{rentalId}/agreement-draft:
    get:
      tags: [DigiRent]
      summary: Retrieve rental agreement draft
      operationId: getAgreementDraft
      description: |
        Customer retrieves the rental agreement draft prepared by DigiRent
        after a successful negotiation. Available only in the closing chain phase.
      parameters:
        - $ref: '#/components/parameters/rentalId'
      responses:
        '200':
          description: Agreement draft available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreementDraft'
        '404':
          description: Rental not found or draft not yet available.

  /rentals/{rentalId}/agreement:
    post:
      tags: [DigiRent]
      summary: Submit signed agreement
      operationId: submitSignedAgreement
      description: Customer submits the signed rental agreement.
      parameters:
        - $ref: '#/components/parameters/rentalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedAgreement'
      responses:
        '200':
          description: Signed agreement received.
        '404':
          description: Rental request not found.

  /rentals/{rentalId}/payment:
    post:
      tags: [DigiRent]
      summary: Submit rental payment
      operationId: submitPayment
      description: Customer submits the rental payment after signing the agreement.
      parameters:
        - $ref: '#/components/parameters/rentalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment'
      responses:
        '200':
          description: Payment received successfully.
        '404':
          description: Rental request not found.

  /rentals/{rentalId}/availabilities:
    post:
      tags: [DigiRent]
      summary: Submit owner availability for visits
      operationId: submitOwnerAvailability
      description: |
        Owner submits their available time slots for apartment visits in
        response to a visit request sent by DigiRent.
      parameters:
        - $ref: '#/components/parameters/rentalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerAvailability'
      responses:
        '200':
          description: Availability recorded.
        '404':
          description: Rental request not found.

  # =========================================================
  # CUSTOMER ENDPOINTS — called by DigiRent
  # =========================================================

  /customers/{customerId}/payment-confirmations:
    post:
      tags: [Customer]
      summary: Send payment confirmation to customer
      operationId: sendPaymentConfirmation
      description: |
        DigiRent notifies the Customer that the payment has been received
        and processed, completing the rental process successfully.
      parameters:
        - $ref: '#/components/parameters/customerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfirmation'
      responses:
        '200':
          description: Confirmation delivered to customer.

  # =========================================================
  # OWNER ENDPOINTS — called by DigiRent
  # =========================================================

  /owners/{ownerId}/visit-requests:
    post:
      tags: [Owner]
      summary: Request visit availability from owner
      operationId: requestOwnerAvailability
      description: |
        DigiRent contacts an Owner to request available time slots for
        apartment visits. The Owner is expected to respond by calling
        POST /rentals/{rentalId}/availabilities on DigiRent.
      parameters:
        - $ref: '#/components/parameters/ownerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitRequest'
      responses:
        '202':
          description: Visit availability request accepted. Response will be sent asynchronously.

  /owners/{ownerId}/payments:
    post:
      tags: [Owner]
      summary: Transfer rental payment to owner
      operationId: transferToOwner
      description: |
        DigiRent transfers the rent payment directly to the Owner after a
        successful rental process (internal phase, no commercial partner involved).
      parameters:
        - $ref: '#/components/parameters/ownerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerPayment'
      responses:
        '200':
          description: Payment successfully transferred to owner.

  # =========================================================
  # COMMERCIAL PARTNER ENDPOINTS — called by DigiRent
  # =========================================================

  /partners/{partnerId}/rental-requests:
    post:
      tags: [CommercialPartner]
      summary: Send rental request to commercial partner
      operationId: contactCommercialPartner
      description: |
        DigiRent contacts a Commercial Partner to request a list of available
        apartments matching the customer's requirements, when the internal
        search has been unsuccessful.
      parameters:
        - $ref: '#/components/parameters/partnerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerRentalRequest'
      responses:
        '202':
          description: Partner rental request accepted. Apartment list will be made available.

  /partners/{partnerId}/apartments:
    get:
      tags: [CommercialPartner]
      summary: Retrieve partner apartment list
      operationId: getPartnerApartments
      description: |
        DigiRent retrieves the list of available apartments from a Commercial
        Partner for a specific rental request.
      parameters:
        - $ref: '#/components/parameters/partnerId'
        - name: rentalId
          in: query
          required: true
          description: Correlation key identifying the rental request.
          schema:
            type: string
      responses:
        '200':
          description: Partner apartment list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartnerApartment'
        '404':
          description: Partner or rental request not found.

  /partners/{partnerId}/payments:
    post:
      tags: [CommercialPartner]
      summary: Transfer payment and fee to commercial partner
      operationId: transferToPartner
      description: |
        DigiRent transfers the rent amount to the Owner via the Commercial
        Partner and allocates the agreed agency fee to the Partner.
        This endpoint covers both the AND-split actions in the closing chain:
        transfer to partner and allocate fee.
      parameters:
        - $ref: '#/components/parameters/partnerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerPayment'
      responses:
        '200':
          description: Funds and fee successfully transferred to partner.

# =========================================================
# REUSABLE COMPONENTS
# =========================================================

components:

  parameters:
    rentalId:
      name: rentalId
      in: path
      required: true
      description: Unique identifier of the rental request (correlation key).
      schema:
        type: string
    customerId:
      name: customerId
      in: path
      required: true
      description: Unique identifier of the customer.
      schema:
        type: string
    ownerId:
      name: ownerId
      in: path
      required: true
      description: Unique identifier of the owner.
      schema:
        type: string
    partnerId:
      name: partnerId
      in: path
      required: true
      description: Unique identifier of the commercial partner.
      schema:
        type: string

  schemas:

    RentalRequest:
      type: object
      required: [customerId, location, numberOfRooms, maxBudget, startDate, endDate]
      properties:
        customerId:
          type: string
        location:
          type: string
        numberOfRooms:
          type: integer
          minimum: 1
        maxBudget:
          type: number
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    RentalCreated:
      type: object
      properties:
        rentalId:
          type: string
          description: Correlation key for all subsequent interactions.
        status:
          type: string
          enum: [created]

    Apartment:
      type: object
      properties:
        apartmentId:
          type: string
        address:
          type: string
        price:
          type: number
        numberOfRooms:
          type: integer
        managedBy:
          type: string
          enum: [DigiRent, Partner]

    PartnerApartment:
      type: object
      properties:
        apartmentId:
          type: string
        partnerId:
          type: string
        address:
          type: string
        price:
          type: number
        partnerFeePercentage:
          type: number

    CustomerSelection:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [interested, no_interest, withdrawn]
        selectedApartmentIds:
          type: array
          items:
            type: string

    ViewingSlot:
      type: object
      properties:
        slotId:
          type: string
        apartmentId:
          type: string
        ownerId:
          type: string
        startTime:
          type: string
          format: date-time
        durationMinutes:
          type: integer

    ScheduleConfirmation:
      type: object
      required: [anySlotConfirmed]
      properties:
        anySlotConfirmed:
          type: boolean
        confirmedSlotIds:
          type: array
          items:
            type: string

    FinalTerms:
      type: object
      properties:
        apartmentId:
          type: string
        monthlyRent:
          type: number
        agencyFee:
          type: number
        contractDurationMonths:
          type: integer

    NegotiationOutcome:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, rejected, withdrawn]

    AgreementDraft:
      type: object
      properties:
        rentalId:
          type: string
        apartmentId:
          type: string
        customerId:
          type: string
        ownerId:
          type: string
        monthlyRent:
          type: number
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    SignedAgreement:
      type: object
      required: [rentalId, signature]
      properties:
        rentalId:
          type: string
        signature:
          type: string
          description: Digital signature or acknowledgement token.
        signedAt:
          type: string
          format: date-time

    Payment:
      type: object
      required: [rentalId, amount]
      properties:
        rentalId:
          type: string
        amount:
          type: number
        paymentMethod:
          type: string
          enum: [bank_transfer, credit_card]

    PaymentConfirmation:
      type: object
      properties:
        rentalId:
          type: string
        confirmedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [confirmed]

    OwnerAvailability:
      type: object
      required: [ownerId, slots]
      properties:
        ownerId:
          type: string
        slots:
          type: array
          items:
            $ref: '#/components/schemas/ViewingSlot'

    VisitRequest:
      type: object
      required: [rentalId, apartmentId, requestedPeriodStart, requestedPeriodEnd]
      properties:
        rentalId:
          type: string
          description: Correlation key so the owner knows which rental request this refers to.
        apartmentId:
          type: string
        requestedPeriodStart:
          type: string
          format: date
        requestedPeriodEnd:
          type: string
          format: date

    OwnerPayment:
      type: object
      required: [rentalId, amount]
      properties:
        rentalId:
          type: string
        amount:
          type: number

    PartnerRentalRequest:
      type: object
      required: [rentalId, location, numberOfRooms, maxBudget, startDate, endDate]
      properties:
        rentalId:
          type: string
          description: DigiRent correlation key, forwarded to partner for routing responses.
        location:
          type: string
        numberOfRooms:
          type: integer
        maxBudget:
          type: number
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    PartnerPayment:
      type: object
      required: [rentalId, rentAmount, partnerFee]
      properties:
        rentalId:
          type: string
        rentAmount:
          type: number
          description: Total rent amount to be forwarded to the owner via the partner.
        partnerFee:
          type: number
          description: Agency fee portion allocated to the commercial partner.
